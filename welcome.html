<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词学习 - 欢迎</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #c8c0b0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #f2ece0;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.12),
        0 24px 80px rgba(0,0,0,0.38),
        inset 0 0 0 1.5px rgba(255,255,255,0.35);
    }

    /* ── Status Bar ── */
    .status-bar {
      height: 44px;
      padding: 14px 26px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-time {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.3px;
    }
    .status-icons { display: flex; align-items: center; gap: 7px; }

    /* ── Page Header ── */
    .page-header {
      text-align: center;
      padding: 16px 0 0;
    }
    .welcome-title {
      font-size: 40px;
      font-weight: 800;
      color: #2c3828;
      letter-spacing: 4px;
    }
    .welcome-sub {
      font-size: 15px;
      color: #5a6a52;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }
    .title-line {
      width: 34px;
      height: 2.5px;
      background: #5a7a5a;
      border-radius: 2px;
      margin: 8px auto 0;
    }

    /* ── Hero Image ── */
    .hero {
      width: 100%;
      height: 258px;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ── Progress Card ── */
    .card {
      margin: -14px 16px 0;
      background: #fff;
      border-radius: 18px;
      padding: 18px 22px 20px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.08);
      position: relative;
      z-index: 2;
    }
    .card-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #5a7a5a;
      font-weight: 500;
    }
    .card-title {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a1a;
      margin-top: 9px;
      letter-spacing: 0.5px;
    }
    .card-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 9px;
    }
    .stat-done  { font-size: 16px; color: #5a7a5a; font-weight: 700; }
    .stat-total { font-size: 16px; color: #a0a8a0; }
    .stat-pct   { font-size: 16px; color: #5a7a5a; font-weight: 700; }
    .progress-track {
      height: 6px;
      background: #ede8e0;
      border-radius: 3px;
      margin-top: 9px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5a7a5a, #80a878);
      border-radius: 3px;
    }

    /* ── CTA ── */
    .cta-wrap { padding: 20px 16px 0; }
    .cta-btn {
      width: 100%;
      height: 56px;
      background: linear-gradient(160deg, #ebb030, #d89020);
      border: none;
      border-radius: 28px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(220,148,28,0.42);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cta-btn:active { opacity: 0.88; }

    /* ── Footer note ── */
    .foot-note {
      text-align: center;
      margin-top: 11px;
      font-size: 12px;
      color: #9aaa90;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* ── Tab Bar ── */
    .tab-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 82px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-top: 0.5px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: flex-start;
      padding-top: 10px;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab-item.active  { color: #3a5a38; }
    .tab-item.passive { color: #b8beb8; }

    .home-bar {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: rgba(0,0,0,0.18);
      border-radius: 3px;
    }
  </style>
</head>
<body>
<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <!-- Signal bars -->
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0"  y="6" width="3.2" height="6"  rx="1" fill="#1c1c1e"/>
        <rect x="4.8" y="4" width="3.2" height="8"  rx="1" fill="#1c1c1e"/>
        <rect x="9.6" y="1.5" width="3.2" height="10.5" rx="1" fill="#1c1c1e"/>
        <rect x="14.4" y="0" width="3.2" height="12" rx="1" fill="#1c1c1e" opacity="0.25"/>
      </svg>
      <!-- WiFi -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M8 9.5 C8.8 9.5 9.5 10.2 9.5 11 C9.5 11.8 8.8 12.5 8 12.5 C7.2 12.5 6.5 11.8 6.5 11 C6.5 10.2 7.2 9.5 8 9.5Z" fill="#1c1c1e"/>
        <path d="M4.2 6.8 C5.3 5.7 6.6 5 8 5 C9.4 5 10.7 5.7 11.8 6.8" stroke="#1c1c1e" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <path d="M1.5 4 C3.2 2.2 5.5 1 8 1 C10.5 1 12.8 2.2 14.5 4" stroke="#1c1c1e" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      </svg>
      <!-- Battery -->
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
        <rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#1c1c1e" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="18" height="9" rx="2" fill="#1c1c1e"/>
        <path d="M24 4.5 C24.9 5 25.5 5.8 25.5 6.5 C25.5 7.2 24.9 8 24 8.5Z" fill="#1c1c1e" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Header -->
  <div class="page-header">
    <div class="welcome-title">欢迎！</div>
    <div class="welcome-sub">先选择你的学习水平</div>
    <div class="title-line"></div>
  </div>

  <!-- Hero Illustration -->
  <img class="hero" src="images/hero.png" alt="书桌插图">

  <!-- Progress Card -->
  <div class="card">
    <div class="card-label">
      <svg width="17" height="15" viewBox="0 0 17 15" fill="none">
        <rect x="0.5" y="2.5" width="16" height="12" rx="2" stroke="#5a7a5a" stroke-width="1.3"/>
        <path d="M1 6h15" stroke="#5a7a5a" stroke-width="1.1"/>
        <path d="M5 0.5v4M12 0.5v4" stroke="#5a7a5a" stroke-width="1.3" stroke-linecap="round"/>
        <!-- open book inside -->
        <path d="M4 9 C4 8 5 7.5 8.5 7.5 C12 7.5 13 8 13 9 L13 13 C13 13 11 12 8.5 12 C6 12 4 13 4 13Z" fill="#5a7a5a" opacity="0.25"/>
        <line x1="8.5" y1="7.5" x2="8.5" y2="12" stroke="#5a7a5a" stroke-width="0.8"/>
      </svg>
      <span>单词书进度</span>
    </div>
    <div class="card-title">高考课标 3500</div>
    <div class="card-stats">
      <div>
        <span class="stat-done">0</span>
        <span class="stat-total"> / 3500</span>
      </div>
      <span class="stat-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <!-- CTA Button -->
  <div class="cta-wrap">
    <button class="cta-btn">选择学习水平 &rsaquo;</button>
  </div>

  <!-- Footer note -->
  <div class="foot-note">
    <svg width="12" height="14" viewBox="0 0 12 14" fill="none">
      <path d="M6 13 C6 13 1 9.5 1 5.5 C1 3 3.2 1 6 1 C8.8 1 11 3 11 5.5 C11 9.5 6 13 6 13Z" fill="#9aaa90" opacity="0.7"/>
      <path d="M6 4 C6 4 4 6 4 7.5 C4 8.8 4.9 9.5 6 9.5 C7.1 9.5 8 8.8 8 7.5 C8 6 6 4 6 4Z" fill="#f2ece0" opacity="0.8"/>
    </svg>
    <span>选择后可随时在【我的】中更改</span>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active">
      <svg width="24" height="22" viewBox="0 0 24 22" fill="none">
        <path d="M2 4 C2 2.9 2.9 2 4 2 L11 2 L11 20 L4 20 C2.9 20 2 19.1 2 18Z" fill="#3a5a38"/>
        <path d="M22 4 C22 2.9 21.1 2 20 2 L13 2 L13 20 L20 20 C21.1 20 22 19.1 22 18Z" fill="#3a5a38"/>
        <line x1="12" y1="2" x2="12" y2="20" stroke="#f2ece0" stroke-width="1" opacity="0.6"/>
      </svg>
      <span>单词</span>
    </div>
    <div class="tab-item passive">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" stroke="#b8beb8" stroke-width="1.6"/>
        <path d="M4 20 C4 16.7 7.6 14 12 14 C16.4 14 20 16.7 20 20" stroke="#b8beb8" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>我的</span>
    </div>
  </div>

  <div class="home-bar"></div>
</div>
</body>
</html>
