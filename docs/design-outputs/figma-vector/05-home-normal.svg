<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">

  <!-- ============ 背景层 ============ -->
  <g id="Background">
    <rect id="bg-base" width="390" height="844" fill="#0B1A17"/>
    <!-- 纹理占位：导入 Figma 后用你的水墨纹理图片替换此矩形的填充 -->
    <rect id="bg-texture-placeholder" width="390" height="844" fill="none" stroke="#24413E" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>
  </g>

  <!-- ============ 状态栏 ============ -->
  <g id="StatusBar" transform="translate(0, 0)">
    <rect id="statusbar-bg" width="390" height="54" fill="none"/>
    <text id="statusbar-time" x="32" y="36" font-family="PingFang SC, SF Pro, system-ui" font-size="16" font-weight="600" fill="#FFF9EF">9:41</text>
    <!-- 右侧信号/wifi/电量用占位 -->
    <g id="statusbar-icons" transform="translate(310, 22)">
      <rect id="signal" x="0" y="0" width="18" height="12" rx="2" fill="none" stroke="#FFF9EF" stroke-width="1" opacity="0.6"/>
      <rect id="wifi" x="24" y="0" width="16" height="12" rx="2" fill="none" stroke="#FFF9EF" stroke-width="1" opacity="0.6"/>
      <rect id="battery" x="46" y="0" width="24" height="12" rx="3" fill="none" stroke="#FFF9EF" stroke-width="1" opacity="0.6"/>
      <rect id="battery-fill" x="48" y="2" width="16" height="8" rx="1.5" fill="#FFF9EF" opacity="0.6"/>
    </g>
  </g>

  <!-- ============ 顶部导航栏 ============ -->
  <g id="TopNav" transform="translate(0, 54)">
    <g id="topnav-book-selector" transform="translate(20, 12)">
      <!-- 书本图标占位 -->
      <rect id="book-icon" x="0" y="2" width="28" height="22" rx="4" fill="#24413E"/>
      <text id="book-name" x="36" y="18" font-family="PingFang SC, system-ui" font-size="15" font-weight="700" fill="#FFF9EF">高考课标 3500</text>
      <text id="book-dropdown" x="148" y="18" font-family="PingFang SC, system-ui" font-size="13" fill="#A9B7B2">⌄</text>
    </g>
    <g id="topnav-streak" transform="translate(280, 12)">
      <circle id="streak-dot" cx="0" cy="12" r="5" fill="#D97757"/>
      <text id="streak-text" x="10" y="17" font-family="PingFang SC, system-ui" font-size="13" font-weight="600" fill="#D97757">连续 3 天</text>
    </g>
  </g>

  <!-- ============ 单词书进度卡 ============ -->
  <g id="BookProgressCard" transform="translate(20, 120)">
    <rect id="card-bg" width="350" height="170" rx="20" fill="#132822" stroke="#24413E" stroke-width="1"/>

    <g id="card-header" transform="translate(24, 24)">
      <text id="card-label" x="0" y="0" font-family="PingFang SC, system-ui" font-size="12" font-weight="600" fill="#5E8A7A" letter-spacing="1">单词书进度</text>
      <!-- 书本图标 -->
      <rect id="card-book-icon" x="0" y="12" width="24" height="20" rx="3" fill="#24413E"/>
    </g>

    <text id="card-book-title" x="24" y="62" font-family="PingFang SC, system-ui" font-size="22" font-weight="900" fill="#FFF9EF">高考课标 3500</text>

    <!-- 进度条 -->
    <g id="card-progress" transform="translate(24, 80)">
      <text id="progress-number" x="0" y="20" font-family="PingFang SC, system-ui" font-size="17" font-weight="900" fill="#FFF9EF">120</text>
      <text id="progress-slash" x="40" y="20" font-family="PingFang SC, system-ui" font-size="14" fill="#5E8A7A">/ 3500</text>
      <text id="progress-percent" x="282" y="20" font-family="PingFang SC, system-ui" font-size="14" font-weight="700" fill="#5E8A7A" text-anchor="end">3%</text>
    </g>

    <!-- 进度条条形 -->
    <g id="card-progress-bar" transform="translate(24, 114)">
      <rect id="progress-bar-track" width="302" height="6" rx="3" fill="#1E3D34"/>
      <rect id="progress-bar-fill" width="10" height="6" rx="3" fill="#D97757"/>
    </g>

    <!-- 旗帜里程碑 -->
    <g id="card-milestones" transform="translate(24, 132)">
      <g id="milestone-1" transform="translate(30, 0)">
        <polygon points="0,-8 0,4 6,0" fill="#5E8A7A" opacity="0.5"/>
      </g>
      <g id="milestone-2" transform="translate(90, 0)">
        <polygon points="0,-8 0,4 6,0" fill="#5E8A7A" opacity="0.5"/>
      </g>
      <g id="milestone-3" transform="translate(150, 0)">
        <polygon points="0,-8 0,4 6,0" fill="#5E8A7A" opacity="0.5"/>
      </g>
      <g id="milestone-4" transform="translate(210, 0)">
        <polygon points="0,-8 0,4 6,0" fill="#5E8A7A" opacity="0.5"/>
      </g>
      <g id="milestone-5" transform="translate(270, 0)">
        <polygon points="0,-8 0,4 6,0" fill="#5E8A7A" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- ============ 今日目标区 ============ -->
  <g id="TodayGoal" transform="translate(20, 310)">
    <rect id="goal-bg" width="350" height="200" rx="20" fill="#132822" stroke="#24413E" stroke-width="1"/>

    <g id="goal-header" transform="translate(24, 24)">
      <circle id="goal-icon" cx="10" cy="6" r="10" fill="none" stroke="#5E8A7A" stroke-width="1.5"/>
      <text id="goal-label" x="28" y="11" font-family="PingFang SC, system-ui" font-size="13" font-weight="600" fill="#5E8A7A">今日目标</text>
    </g>

    <g id="goal-number" transform="translate(24, 56)">
      <text id="goal-count" x="0" y="40" font-family="PingFang SC, system-ui" font-size="48" font-weight="900" fill="#FFF9EF">4</text>
      <text id="goal-unit" x="40" y="40" font-family="PingFang SC, system-ui" font-size="20" font-weight="700" fill="#A9B7B2">个 List</text>
    </g>

    <!-- 旗帜进度（4个list，用旗帜表示） -->
    <g id="goal-flags" transform="translate(24, 108)">
      <g id="flag-1" transform="translate(0, 0)">
        <polygon points="0,0 0,16 10,12 10,-4" fill="#5E8A7A"/>
        <line x1="0" y1="0" x2="0" y2="20" stroke="#5E8A7A" stroke-width="1.5"/>
      </g>
      <g id="flag-2" transform="translate(40, 0)">
        <polygon points="0,0 0,16 10,12 10,-4" fill="#5E8A7A"/>
        <line x1="0" y1="0" x2="0" y2="20" stroke="#5E8A7A" stroke-width="1.5"/>
      </g>
      <g id="flag-3" transform="translate(80, 0)">
        <polygon points="0,0 0,16 10,12 10,-4" fill="#5E8A7A" opacity="0.3"/>
        <line x1="0" y1="0" x2="0" y2="20" stroke="#5E8A7A" stroke-width="1.5" opacity="0.3"/>
      </g>
      <g id="flag-4" transform="translate(120, 0)">
        <polygon points="0,0 0,16 10,12 10,-4" fill="#5E8A7A" opacity="0.3"/>
        <line x1="0" y1="0" x2="0" y2="20" stroke="#5E8A7A" stroke-width="1.5" opacity="0.3"/>
      </g>
    </g>

    <!-- 主按钮 -->
    <g id="goal-cta" transform="translate(24, 146)">
      <rect id="cta-bg" width="302" height="44" rx="12" fill="#D97757"/>
      <text id="cta-text" x="151" y="28" font-family="PingFang SC, system-ui" font-size="16" font-weight="900" fill="#141413" text-anchor="middle">继续</text>
    </g>
  </g>

  <!-- ============ 错词提示条 ============ -->
  <g id="WrongWordHint" transform="translate(20, 530)">
    <rect id="hint-bg" width="350" height="48" rx="14" fill="#1E3D34" stroke="#24413E" stroke-width="1"/>
    <g id="hint-icon" transform="translate(18, 14)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#D97757" stroke-width="1.5"/>
      <text x="10" y="15" font-family="PingFang SC, system-ui" font-size="12" font-weight="700" fill="#D97757" text-anchor="middle">✕</text>
    </g>
    <text id="hint-text" x="46" y="30" font-family="PingFang SC, system-ui" font-size="13" font-weight="700" fill="#A9B7B2">8 个错词待复习</text>
    <text id="hint-time-note" x="326" y="30" font-family="PingFang SC, system-ui" font-size="11" font-weight="600" fill="#5E8A7A" text-anchor="end">晚间入口已开启</text>
  </g>

  <!-- ============ 底部装饰区（书本场景占位） ============ -->
  <g id="BottomScene" transform="translate(0, 620)">
    <!-- 桌面/书本场景占位：导入 Figma 后用你的场景图替换 -->
    <rect id="scene-placeholder" x="20" y="0" width="350" height="140" rx="16" fill="#0F221D" stroke="#1E3D34" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
    <text id="scene-label" x="195" y="76" font-family="PingFang SC, system-ui" font-size="13" fill="#3A5E52" text-anchor="middle">底部场景图占位 — 在 Figma 中替换为水墨书桌图</text>
  </g>

  <!-- ============ 底部 Tab 栏 ============ -->
  <g id="TabBar" transform="translate(0, 780)">
    <rect id="tabbar-bg" width="390" height="64" rx="0" fill="#0A1613" opacity="0.96"/>
    <!-- 分割线 -->
    <line id="tabbar-divider" x1="0" y1="0" x2="390" y2="0" stroke="#1E3D34" stroke-width="0.5"/>

    <g id="tab-words" transform="translate(97, 12)">
      <g id="tab-words-icon">
        <rect x="4" y="0" width="18" height="14" rx="3" fill="#D97757"/>
        <rect x="8" y="4" width="10" height="2" rx="1" fill="#0A1613"/>
        <rect x="8" y="8" width="7" height="2" rx="1" fill="#0A1613"/>
      </g>
      <text id="tab-words-label" x="13" y="30" font-family="PingFang SC, system-ui" font-size="10" font-weight="700" fill="#D97757" text-anchor="middle">单词</text>
    </g>

    <g id="tab-profile" transform="translate(267, 12)">
      <g id="tab-profile-icon">
        <circle cx="13" cy="5" r="5" fill="none" stroke="#5E8A7A" stroke-width="1.5"/>
        <path d="M3 18 Q13 12 23 18" fill="none" stroke="#5E8A7A" stroke-width="1.5"/>
      </g>
      <text id="tab-profile-label" x="13" y="30" font-family="PingFang SC, system-ui" font-size="10" font-weight="700" fill="#5E8A7A" text-anchor="middle">我的</text>
    </g>
  </g>

  <!-- ============ 安全区底部 ============ -->
  <g id="SafeArea-Bottom">
    <rect id="safe-area-bottom" y="844" width="390" height="0" fill="#0A1613"/>
  </g>

</svg>